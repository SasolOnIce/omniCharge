<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>omniCharge - Split Payment Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>omniCharge ⚡</h1>
      <p>NFC Split-Payment Tap Simulator</p>
    </header>

    <!-- Card Balances View -->
    <section class="cards-section">
      <h3>Active Wallet Cards</h3>
      <div class="cards-grid">
        <div class="card" id="card-1">
          <span class="card-title">Primary Card</span>
          <span class="card-balance" id="balance-1">R50.00</span>
        </div>
        <div class="card" id="card-2">
          <span class="card-title">Savings Card</span>
          <span class="card-balance" id="balance-2">R100.00</span>
        </div>
        <div class="card" id="card-3">
          <span class="card-title">Backup Card</span>
          <span class="card-balance" id="balance-3">R200.00</span>
        </div>
      </div>
    </section>

    <!-- POS Terminal Simulator -->
    <section class="pos-terminal">
      <h3>POS Terminal</h3>
      <div class="input-group">
        <label for="amount">Enter Amount (ZAR):</label>
        <input type="number" id="amount" placeholder="e.g. 125.50" step="0.01">
      </div>
      <button id="tap-btn">💳 Tap NFC Card to Pay</button>
    </section>

    <!-- Transaction Result Output -->
    <section id="receipt" class="receipt hidden">
      <h3>Transaction Status: <span id="status-tag"></span></h3>
      <p id="total-text"></p>
      <div id="breakdown-list"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
